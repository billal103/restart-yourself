name: CI

# Runs the exact same checks used throughout development — typecheck, lint,
# the real-Postgres RLS/RPC suite (PGlite, no Docker needed), unit tests,
# build, and the Playwright suite (including real browser-level WebRTC
# negotiation) — on every push and pull request.
#
# Deployment itself is handled by Cloudflare's own Git-connected build
# pipeline (Workers & Pages → the "restart-yourself" project), triggered
# directly by Cloudflare on every push to main — not from here. An earlier
# version of this file had a second `deploy` job using `cloudflare/pages-action`,
# which targeted the classic, separate Pages API; this repo deploys as a
# Workers-with-static-assets project instead (see wrangler.jsonc), and running
# both would just double-deploy through two different, incompatible paths.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx oxlint

      - name: Unit tests (Vitest + Testing Library)
        run: npx vitest run

      - name: Real-Postgres RLS/RPC tests (PGlite, no Docker needed)
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (including real WebRTC negotiation)
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
